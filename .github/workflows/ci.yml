name: CI

on:
  push:
    branches: [main, redesign]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck edge functions (Deno)
        run: npm run functions:check

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --ci

  database:
    name: Database migrations and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Starts Postgres only (Supabase image, includes the auth schema) and applies supabase/migrations.
      - name: Start local database
        run: npx supabase db start

      - name: RLS tests (pgTAP)
        run: npx supabase test db
