name: x_pire
description: A cross-platform fridge inventory management app with AI-powered expiry date detection.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_storage: ^12.3.6
  cloud_firestore: ^5.5.2
  
  # Camera & Image
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  
  # AI/ML
  google_mlkit_text_recognition: ^0.13.1
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Date Handling
  intl: ^0.19.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
