name: x_pire
description: A cross-platform fridge inventory management app with AI-powered expiry date detection.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_storage: ^11.6.0
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.8.0
  
  # Camera & Image
  image_picker: ^1.0.7
  camera: ^0.10.5+9
  
  # AI/ML
  google_ml_kit: ^0.16.3
  
  # Permissions
  permission_handler: ^11.2.0
  
  # Date Handling
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # Note: custom font removed because the font file is missing
  # fonts:
  #   - family: Alata
  #     fonts:
  #       - asset: fonts/Alata-Regular.ttf
